# Topology A (HOMELAB.md): dummy AI Gateway and llm-d-sc in the SAME Pod,
# talking over 127.0.0.1. Evidence for S-001, P-030, P-031.
#
# llm-d-sc runs as a NATIVE SIDECAR (an initContainer with restartPolicy:
# Always, Kubernetes 1.29+). That is what makes this a Job rather than a Pod
# that hangs forever: a plain second container would keep running after the
# probe exits and the Job would never complete. As a sidecar, it is terminated
# automatically once the probe finishes.
# Images are written as vendor-neutral placeholders (`llm-d-sc/...:latest`).
# They are rewritten to a concrete, DIGEST-PINNED reference at deploy time by
# `hack/deploy-cluster`, which records what it resolved in
# artifacts/deployed-digests.json. Hardcoding a cluster's internal registry here
# would make these manifests unusable anywhere else and contradicts ADR-0004
# (Kubernetes, not OpenShift); hardcoding a digest would make them unreadable.
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-d-sc-topology-a
  namespace: llm-d-sc
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: llm-d-sc-topology-a}
    spec:
      restartPolicy: Never
      volumes:
        - name: models
          emptyDir: {}
      initContainers:
        # ModelCar: the artifact arrives as its own OCI image and is copied into
        # a shared volume. The service image contains no model.
        - name: modelcar
          image: llm-d-sc/llm-d-sc-modelcar:latest
          # The copy must be IDEMPOTENT. Model files are mode 444 in the
          # modelcar image, so `cp` reproduces them read-only into the emptyDir.
          # That volume survives container restarts, and cp cannot truncate a
          # read-only destination even as its owner -- so a plain `cp -R` succeeds
          # on first run and fails with EACCES on every restart thereafter,
          # leaving the pod in Init:CrashLoopBackOff with no way to self-heal.
          # Observed in the homelab: 329 restarts over 32h behind a classifier
          # that scored fine offline.
          command: ["/bin/sh", "-c", "rm -rf /shared/* /shared/.[!.]* 2>/dev/null || true; cp -R /models/. /shared/ && ls -la /shared"]
          volumeMounts: [{name: models, mountPath: /shared}]
        - name: llm-d-sc
          image: llm-d-sc/llm-d-sc:latest
          restartPolicy: Always      # native sidecar
          env:
            - {name: LLM_D_SC_MODEL_DIR, value: /models}
            - {name: LLM_D_SC_CLASSIFIER, value: complexity}
            - {name: LLM_D_SC_LISTEN, value: "127.0.0.1:50051"}
          volumeMounts: [{name: models, mountPath: /models}]
          # No HTTP health endpoint exists yet (tracked gap), so readiness is a
          # TCP check: the listener only binds after load and warmup succeed.
          readinessProbe:
            tcpSocket: {port: 50051}
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
      containers:
        - name: gateway-probe
          image: llm-d-sc/llm-d-sc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /usr/local/bin/llm-d-sc-gateway-probe --target 127.0.0.1:50051 \
                    --topology same-pod --samples 200; do
                echo "waiting for the sidecar to become ready..."; sleep 3
              done
          resources:
            requests: {cpu: 200m, memory: 256Mi}
